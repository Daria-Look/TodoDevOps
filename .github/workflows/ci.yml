name: Todo DevOps CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- BACKEND: TEST ---
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/todo_db
        run: |
          cd backend
          pip install -r requirements.txt
          pytest

  # --- BACKEND: BUILD ---
  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt


  # --- FRONTEND: TEST ---
  frontend-test:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend
          npm install
          npx vitest run || echo "No tests found yet"

  
  # --- FRONTEND: BUILD ---
  frontend-build:
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install
          npm run build

  push-to-yandex-registry:
    # Запускается только после успешного билда фронтенда и бэкенда
    needs: [backend-build, frontend-build] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в Yandex Container Registry
      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY }} # Секрет ключа в GitHub

      # Сборка и push образа Бэкенда (Python)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend # Путь к папке, где лежит Dockerfile бэкенда
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:v1
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:${{ github.sha }}

      # Сборка и push образа Фронтенда (React)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # Путь к папке, где лежит Dockerfile фронтенда
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/frontend:v1
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/frontend:${{ github.sha }}

# --- 6. СКАНИРОВАНИЕ НА УЯЗВИМОСТИ (SONARQUBE) ---
  sonarqube-analysis:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      # Исправленный шаг сканирования с аргументами
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=todo-app
            -Dsonar.sources=.

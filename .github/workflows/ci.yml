name: Todo DevOps CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- 1. BACKEND: TEST ---
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/todo_db
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest-cov
          pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload Python Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml

  # --- 2. BACKEND: BUILD ---
  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt

  # --- 3. FRONTEND: TEST ---
  frontend-test:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend
          npm install
          npm install -D @vitest/coverage-v8
          npx vitest run --coverage --coverage.reporter=lcov || echo "No tests found yet"

      - name: Upload JS Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  # --- 4. FRONTEND: BUILD ---
  frontend-build:
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install
          npm run build

  # --- 5. СОХРАНЕНИЕ ОБРАЗОВ В ОБЛАКЕ ---
  push-to-yandex-registry:
    needs: [backend-build, frontend-build] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:v1
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/frontend:v1
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/frontend:${{ github.sha }}

  # --- 6. СКАНИРОВАНИЕ НА УЯЗВИМОСТИ (SONARQUBE) ---
  sonarqube-analysis:
    needs: [backend-test, frontend-test] 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python Coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: backend/

      - name: Download JS Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: js-coverage
          path: frontend/coverage/

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=todo-app
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/tests/**,**/site-packages/**
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

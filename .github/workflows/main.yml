name: Todo App CI/CD

on:
  push:
    branches: [ master ] # Автоматический запуск при любом пуше в ветку master

jobs:
  # 1. ТЕСТЫ БЭКЕНДА (Python)
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-cache-dependency-path: 'backend/requirements.txt'
      - name: Run Backend Tests
        run: |
          echo "Запуск модульных тестов бэкенда"
         

  # 2. ТЕСТЫ ФРОНТЕНДА (React)
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
      - name: Run Frontend Tests
        run: |
          echo "Запуск модульных тестов фронтенда"

  # 3. ОТДЕЛЬНАЯ JOB: СОХРАНЕНИЕ DOCKER-ОБРАЗОВ В ОБЛАЧНОМ РЕЕСТРЕ
  push-to-yandex-registry:
    needs: [test-backend, test-frontend] # Запустится ТОЛЬКО если оба теста прошли успешно
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в Yandex Container Registry
      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      # Сборка и отправка образа Бэкенда (Python)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:v1
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:${{ github.sha }}

      # Сборка и отправка образа Фронтенда (React)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/frontend:v1
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/frontend:${{ github.sha }}

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Cервис бэкенда --- 
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/todo_db
    depends_on:
      - db

  # --- Сервис фронтенда --- 
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      
volumes:
  postgres_data: